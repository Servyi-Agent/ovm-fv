name: ci
on: [push, pull_request]
jobs:
  specs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install elan
        run: |
          curl -sSfL https://elan.lean-lang.org/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - run: specs/tools/check.sh
  verus-lookup-walk:
    runs-on: ubuntu-latest
    continue-on-error: true   # best-effort until verus install is pinned
    steps:
      - uses: actions/checkout@v4
      - name: install verus
        run: |
          ASSET=$(curl -s https://api.github.com/repos/verus-lang/verus/releases/latest \
            | python3 -c "import json,sys; print([a['browser_download_url'] for a in json.load(sys.stdin)['assets'] if a['name'].endswith('-x86-linux.zip')][0])")
          curl -sL "$ASSET" -o /tmp/verus.zip
          unzip -q /tmp/verus.zip -d /tmp/verus-dist
          echo "VERUS_DIST=$(dirname "$(find /tmp/verus-dist -name verus -type f | head -1)")" >> "$GITHUB_ENV"
      - run: verus/lookup-walk/check.sh
        env:
          VERUS: ${{ env.VERUS_DIST }}/verus