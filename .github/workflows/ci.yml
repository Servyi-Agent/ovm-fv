name: ci
on: [push, pull_request]
jobs:
  specs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install elan
        run: |
          curl -sSfL https://elan.lean-lang.org/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - run: specs/tools/check.sh
  verus-lookup-walk:
    runs-on: ubuntu-latest
    continue-on-error: true   # best-effort until verus install is pinned
    steps:
      - uses: actions/checkout@v4
      - name: install rust toolchain (per rust-toolchain.toml)
        run: |
          curl -sSfL https://sh.rustup.rs | sh -s -- -y
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          source "$HOME/.cargo/env"
          rustup toolchain install 1.98.1-x86_64-unknown-linux-gnu
          # the verus binary itself demands 1.99.1 at runtime
          rustup toolchain install 1.99.1-x86_64-unknown-linux-gnu
      - name: install verus
        run: |
          ASSET=https://github.com/verus-lang/verus/releases/download/release/0.2026.11.02.8bf68ee/verus-0.2026.11.02.8bf68ee-x86-linux.zip
          curl -sSfL "$ASSET" -o /tmp/verus.zip
          unzip -q /tmp/verus.zip -d /tmp/verus-dist
          echo "VERUS_DIST=$(dirname "$(find /tmp/verus-dist -name verus -type f | head -1)")" >> "$GITHUB_ENV"
      - run: verus/lookup-walk/check.sh
        env:
          VERUS: ${{ env.VERUS_DIST }}/verus